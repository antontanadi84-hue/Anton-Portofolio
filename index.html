<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antz Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%); 
            min-height: 100vh;
            color: #f8fafc;
        }
        .glass-box { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto">

        <header class="relative w-full h-80 overflow-hidden rounded-xl mb-4">
        <div class="absolute inset-0 bg-cover bg-center bg-fixed" 
             style="background-image: url('banner.png');">
        </div>
        
        <div class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center">
            <h1 class="text-4xl md:text-6xl font-bold uppercase tracking-widest text-white">
                It's me Antz
            </h1>
        </div>
    </header>


    <section class="glass-box p-6 mb-4 rounded-xl">
        <h2 class="text-xl font-bold uppercase tracking-wider text-cyan-400">About Me</h2>
        </section>

    <section class="glass-box p-6 mb-4 rounded-xl">
        <h2 class="text-xl font-bold uppercase tracking-wider text-cyan-400">Tech Stack</h2>
        </section>

    <section class="glass-box p-6 mb-4 rounded-xl">
        <h2 class="text-xl font-bold uppercase tracking-wider text-cyan-400">Portfolio</h2>
        </section>

    <section class="glass-box p-6 mb-4 rounded-xl">
        <h2 class="text-xl font-bold uppercase tracking-wider text-cyan-400">Latest Updates</h2>
        </section>

</body>
</html>
