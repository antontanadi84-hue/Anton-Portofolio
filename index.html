<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's me Antz | Techy Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #e2e8f0; font-family: sans-serif; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .animate-fade { animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="animate-fade">

<header class="w-full h-48 md:h-80 relative">
    <img src="banner.png" alt="Banner" class="w-full h-full object-cover">
    <div class="absolute inset-0 flex items-center justify-center bg-black/50">
        <h1 class="text-3xl md:text-6xl font-bold text-white uppercase">It's me Antz</h1>
    </div>
</header>

<section class="p-4 md:p-10">
    <div class="flex flex-col md:flex-row gap-6">
        <div class="w-full md:w-1/3">
            <img src="foto.png" alt="Foto Profil" class="rounded-xl w-full shadow-lg border border-white/20">
        </div>
        <div class="w-full md:w-2/3 glass p-6 rounded-xl">
            <h2 class="text-2xl font-bold mb-2">Hi, Nama saya Anton</h2>
            <p class="text-sm md:text-base text-gray-300">Portofolio futuristik yang dioptimalkan untuk HP dan Desktop.</p>
        </div>
    </div>
</section>

<section class="p-4 grid grid-cols-3 gap-2">
    <div class="glass p-3 rounded-lg text-center text-xs md:text-base">Skill 1</div>
    <div class="glass p-3 rounded-lg text-center text-xs md:text-base">Skill 2</div>
    <div class="glass p-3 rounded-lg text-center text-xs md:text-base">Skill 3</div>
</section>

<section class="p-4">
    <h2 class="text-xl mb-4 text-center">My Portfolio</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glass p-4 rounded-xl text-center"><a href="tiktok.com">Project 1</a></div>
        <div class="glass p-4 rounded-xl text-center"><a href="tiktok.com">Project 2</a></div>
        <div class="glass p-4 rounded-xl text-center"><a href="tiktok.com">Project 3</a></div>
    </div>
</section>

<section class="p-4 mb-20">
    <h2 class="text-xl mb-4 text-center">Latest Updates</h2>
    <div class="glass p-6 rounded-xl text-center">
        <p class="text-sm md:text-base text-gray-300">Update terbaru Anda akan tampil di sini.</p>
    </div>
</section>

</body>
</html>
